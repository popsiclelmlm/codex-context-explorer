<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Context Explorer</title><style>
:root{color-scheme:light dark;--bg:#faf9fc;--fg:#202124;--muted:#78787e;--line:#e3e2e8;--row:#eeedf2;--code:#fff;--track:#e9e9eb;--intro:#626269;--warning-bg:#f7f0e0;--warning-fg:#78633c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:800px;margin:0 auto;padding:32px 26px}.eyebrow,.muted,.help{color:var(--muted);font-size:12px}h1,h2{font-weight:500;letter-spacing:-.35px}h1{font-size:25px;margin:3px 0 24px}h2{font-size:24px;margin:0}.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:20px 0}.meta div{overflow-wrap:anywhere}.meta label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.intro{color:var(--intro);margin:22px 0}.chart{display:flex;flex-direction:column;align-items:center;margin:26px 0 30px}.donut{width:min(100%,320px);aspect-ratio:1;position:relative;display:grid;place-items:center}#donut-arcs{position:absolute;inset:0}#donut-arcs svg{display:block;width:100%;height:100%}.hole{pointer-events:none;height:70%;width:70%;position:absolute;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.hole strong{font-size:38px;font-weight:500}.hole span{font-size:12px;color:var(--muted);max-width:150px}select,button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:5px;padding:7px 10px}select{max-width:100%}#sessions{width:100%;font:12px monospace}button{cursor:pointer}button:hover{background:var(--row)}.chart select{font-size:12px;margin-top:16px;width:100%}.usage-card{width:100%;margin-top:22px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--code)}.usage-card-head{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-bottom:8px}.usage-card-head a{color:inherit;text-decoration:none}.usage-card-head a:hover{text-decoration:underline}.usage-stats{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.usage-track{height:6px;background:transparent;display:flex;border-radius:4px;overflow:hidden;margin:8px 0 13px}.usage-segment{height:100%;flex-shrink:0;clip-path:inset(0 min(1.5px,8%));cursor:pointer}.legend-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}.legend-swatch{width:12px;height:12px;border-radius:2px;flex-shrink:0}.legend-value{color:var(--muted);font-variant-numeric:tabular-nums}.chart-note{font-size:11px;color:var(--muted);margin:10px 0 0;line-height:1.5}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:22px}.actions{display:flex;gap:8px}.actions button{font-size:12px;white-space:nowrap}.category{margin:7px 0;border-radius:6px;background:var(--row)}summary{cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;list-style:none}.icon{width:16px;height:16px;flex-shrink:0;stroke-width:1.6;color:var(--muted)}.chevron{width:12px;height:12px;transition:transform .12s}details[open]>summary>.chevron{transform:rotate(90deg)}.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trailing{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}.help{margin:5px 18px 10px 44px}.turn{margin:3px 10px 3px 24px;background:var(--bg);border-left:1px solid var(--line)}.turn>summary{font-size:12px}.turn>.item{margin-left:22px}.item{border-left:1px solid var(--line);margin:3px 10px 3px 30px;background:var(--bg)}.item summary{font-size:12px;padding:8px}.item pre{margin:8px;padding:12px;background:var(--code);white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,monospace;max-height:360px;overflow:auto}#warning{font-size:12px;background:var(--warning-bg);color:var(--warning-fg);border-radius:6px;padding:12px;margin:12px 0 20px}#error{color:#bd412a;font-size:12px}footer{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);margin-top:24px;padding-top:16px;font-size:12px;color:var(--muted)}@media(max-width:500px){main{padding:20px 14px}.meta{gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}.section-head{align-items:flex-start;flex-direction:column}.actions{width:100%}h1{font-size:22px}.item{margin-left:16px}.trailing{font-size:11px}}@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--fg:#e9e9ed;--muted:#aaaab3;--line:#42434a;--row:#2e3036;--code:#26272d;--track:#41434a;--intro:#bdbdc6;--warning-bg:#393327;--warning-fg:#ddc996;color-scheme:dark}}:root[data-theme="dark"]{--bg:#202124;--fg:#e9e9ed;--muted:#aaaab3;--line:#42434a;--row:#2e3036;--code:#26272d;--track:#41434a;--intro:#bdbdc6;--warning-bg:#393327;--warning-fg:#ddc996;color-scheme:dark}:root[data-theme="light"]{color-scheme:light}.ring-segment,.usage-segment,.legend-row{transition:opacity .12s}.ring-segment{cursor:pointer;pointer-events:stroke}.ring-segment:focus{outline:none}.usage-track:empty{background:var(--track)}.chart.has-chart-focus [data-chart-surface="ring"],.chart.has-chart-focus [data-chart-surface="bar"]{opacity:.23}.chart.has-chart-focus [data-chart-part].is-active{opacity:1}.chart.has-chart-focus .legend-row:not(.is-active) .legend-swatch{opacity:.35}.legend-row{border-radius:4px;cursor:default}.legend-row.is-active{background:var(--row)}.legend-row:focus-visible{outline:2px solid var(--fg);outline-offset:2px}.report-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.report-heading{min-width:0}.report-header h1{font-size:24px;margin:3px 0 0;overflow-wrap:anywhere}.preferences{display:flex;gap:2px;flex-shrink:0}.preference{position:relative}.preferences .icon-button{width:32px;height:32px;padding:7px;display:grid;place-items:center;border-radius:7px;list-style:none}.icon-button::-webkit-details-marker{display:none}.preferences .icon-button:hover,.preference[open]>.icon-button{background:var(--row)}.icon-button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}.popover{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:140px;padding:5px;background:var(--code);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002}.popover button{border:0;background:transparent;width:100%;display:flex;gap:9px;align-items:center;text-align:left;white-space:nowrap;font-size:12px;padding:8px 10px;border-radius:6px}.popover button:hover,.popover button.is-selected{background:var(--row)}.popover button.is-selected{font-weight:600}.info-popover{width:min(340px,calc(100vw - 28px));padding:14px;font-size:12px;line-height:1.65;color:var(--muted)}.info-popover h3{color:var(--fg);font-size:12px;margin:0 0 8px}.info-popover p{margin:0 0 10px}.info-popover p:last-child{margin-bottom:0}.info-popover #warning{margin:0 0 10px;padding:0;background:none;color:inherit}.inline-note{font-size:12px;color:var(--muted);margin-top:12px}#updated{margin-left:auto}@media(max-width:500px){.report-header{gap:8px}.report-header h1{font-size:21px}.preferences .icon-button{width:30px;height:30px;padding:6px}#updated{margin-left:0}}
</style></head><body><main><header class="report-header"><div class="report-heading"><div class="eyebrow" data-i18n="eyebrow">上下文报告</div><h1 id="title">Context Explorer</h1></div><div class="preferences"><details class="preference" id="language-control"><summary class="icon-button" id="language-toggle" aria-label="Language"></summary><div class="popover"><button type="button" data-language="zh">中文</button><button type="button" data-language="en">English</button></div></details><details class="preference" id="theme-control"><summary class="icon-button" id="theme-toggle" aria-label="Theme"></summary><div class="popover"><button type="button" id="theme-system" data-theme-choice="system"></button><button type="button" id="theme-light" data-theme-choice="light"></button><button type="button" id="theme-dark" data-theme-choice="dark"></button></div></details><details class="preference" id="info-control"><summary class="icon-button" id="info-toggle" aria-label="Data details"></summary><div class="popover info-popover"><h3 data-i18n="info">统计口径</h3><p id="warning"></p><p id="chart-note"></p><p data-i18n="pricingMethod"></p><p id="pricing-details"></p></div></details></div></header><select id="sessions" data-i18n-aria="sessionSelector" aria-label="选择会话"></select><div class="meta"><div><label data-i18n="repository">Repository</label><span id="repo">—</span></div><div><label data-i18n="window">Context size</label><span id="window">—</span></div><div><label data-i18n="recentTokens">最近请求 tokens</label><span id="used">—</span></div><div><label data-i18n="model">模型</label><span id="model">—</span></div></div><div class="chart" id="context-chart"><div class="donut" id="donut" role="group" aria-label="上下文占用"><div id="donut-arcs"></div><div class="hole" aria-live="polite" aria-atomic="true"><strong id="donut-value">—</strong><span id="donut-caption">等待数据</span></div></div><div class="usage-card"><div class="usage-card-head"><span data-i18n="contextUsage">Context Usage</span><a href="#tree" data-i18n="viewDetails">查看明细</a></div><div class="usage-stats"><span id="fill-label">—</span><span id="usage-ratio">—</span></div><div id="usage-track" class="usage-track" aria-hidden="true"></div><div id="chart-legend"></div><select id="chart-mode" data-i18n-aria="chartBasis" aria-label="图表统计口径"><option value="categories" selected data-i18n="visibleMode">可见文本 / 窗口</option><option value="window" data-i18n="requestMode">最近请求 / 上下文窗口（日志值）</option></select></div></div><div class="section-head"><h2>Context Explorer</h2><div class="actions"><button id="expand">展开全部</button><button id="refresh" data-i18n="refresh">刷新</button><button id="copy">复制分析摘要</button></div></div><div id="retention-note" class="inline-note" hidden></div><div id="error" role="status"></div><div id="tree"></div><footer><div id="usage"></div><div id="cost"></div><div id="updated"></div></footer></main><script type="module">/* APP_CODE */</script></body></html>
